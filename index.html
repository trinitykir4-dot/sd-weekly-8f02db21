<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kir · AI Systems Design · weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* B2S - the B2Spin style since 10 Nov 2026: black, white and greys, inverse primary, kit tones only for states and chart series. Tokens = Brief Hub .theme-b2s */
:root{--bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--card3:#262626;--line:#303030;--edge:#666;--txt:#f5f5f5;--dim:#a3a3a3;--faint:#858585;
 --green:#9DDDB0;--yellow:#F6CD7F;--red:#F5A3B3;--blue:#9DB0FF;--r-card:22px;--r-ctl:18px;
 --head:"Archivo","Archivo Expanded",system-ui,sans-serif;--body:"Inter",-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{font:15px/1.55 var(--body);background:var(--bg);color:var(--txt);margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--txt);text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:3px}a:hover{text-decoration-color:var(--txt)}
.wrap{max-width:1120px;margin:auto;padding:0 24px 80px;position:relative}
h1,h2,.k b,.eyebrow{font-family:var(--head);font-stretch:125%}
/* hero with black-and-white light spots */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:56px 0 28px;isolation:isolate}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none}
.hero:before{width:520px;height:520px;left:-200px;top:-260px;background:rgba(255,255,255,.10)}
.hero:after{width:360px;height:360px;right:40px;top:-60px;background:rgba(255,255,255,.06)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{font-size:clamp(30px,5vw,52px);line-height:.98;font-weight:800;letter-spacing:-.02em;margin:12px 0 14px}
.lead{color:var(--dim);max-width:620px;margin:0}
.hero img{width:clamp(150px,24vw,260px);height:auto;display:block}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding-top:36px}.hero img{width:170px;order:-1}}
/* tabs: active = inverse */
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);padding:12px 0;margin:8px 0 4px;z-index:3;border-bottom:1px solid var(--line)}
.tab{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 16px;cursor:pointer;font:500 14px var(--body)}
.tab:hover{color:var(--txt);border-color:var(--edge)}
.tab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.tab:focus-visible,.leg button:focus-visible,.col:focus-visible{outline:2px solid var(--txt);outline-offset:2px}
.meta{color:var(--dim);font-size:14px;margin-top:22px}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:44px 0 14px;display:flex;align-items:center;gap:14px}
h2 img{width:76px;height:auto;flex:none}
.tldr{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 22px;margin-top:16px}
.tldr ul{margin:0;padding-left:18px}.tldr li{margin:6px 0;line-height:1.5}
div.sts{display:grid;grid-template-columns:1fr;gap:12px}
details.st{display:block;width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);margin:0;overflow:hidden}
details.st summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:14px 18px}
details.st summary::-webkit-details-marker{display:none}
details.st summary img{width:52px;height:auto;flex:none}
details.st summary b{font-size:16px}details.st summary small{color:var(--dim);display:block;font-size:13px;margin-top:2px}
details.st summary .hh{margin-left:auto;font-weight:700;white-space:nowrap}
details.st summary .hh::after{content:" +";color:var(--dim)}details.st[open] summary .hh::after{content:" -"}
details.st .bd{padding:0 18px 16px 84px;line-height:1.55}details.st .bd li{margin:6px 0}
details.st .shot{display:block;margin:14px 0 4px}details.st .shot img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
details.st .blk{border-left:3px solid #F5A3B3;padding:6px 12px;margin:4px 0 8px;color:var(--txt)}
details.st a,.tldr a{color:var(--txt)}
@media(max-width:560px){details.st .bd{padding-left:18px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px}
.k b .d{display:inline;margin:0 0 0 10px;font-size:14px;vertical-align:middle}
.k b{font-size:34px;font-weight:800;display:block;white-space:nowrap;line-height:1.1;letter-spacing:-.02em}.k span{color:var(--dim);font-size:13px;display:block;margin-top:6px}
.d{font:600 13px var(--body);margin-left:8px;letter-spacing:0;vertical-align:middle}.d.up{color:var(--yellow)}.d.dn{color:var(--green)}
.stack{display:flex;height:40px;border-radius:12px;overflow:hidden;margin:8px 0 12px;gap:2px;background:var(--bg)}
.stack div{display:block;line-height:40px;padding:0 10px;text-overflow:ellipsis;text-align:center;font-size:12px;color:#0a0a0a;font-weight:600;white-space:nowrap;overflow:hidden;cursor:default}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--dim)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.leg button{background:none;border:0;color:var(--txt);font:inherit;cursor:pointer;padding:3px 0}.leg button.off{opacity:.35}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 22px}
.row{display:grid;grid-template-columns:minmax(150px,340px) 1fr 52px;gap:12px;align-items:center;margin:7px 0;font-size:14px}
.bar{height:14px;border-radius:7px;min-width:3px;transition:width .3s}.v{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
@media(max-width:640px){.row{grid-template-columns:1fr 44px}.row>div:nth-child(2){grid-column:1/-1;grid-row:2}}
ul{margin:0;padding-left:20px}li{margin:6px 0}li::marker{color:var(--faint)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:6px 14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}tr:last-child td{border-bottom:0}
th{color:var(--dim);font-weight:500;font-size:13px}
.st{display:inline-flex;gap:7px;align-items:baseline}.st b{font-weight:700}
.cols{display:flex;align-items:flex-end;gap:18px;height:240px;border-bottom:1px solid var(--line);padding:0 8px;margin-top:12px;position:relative}
.col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;cursor:pointer;max-width:120px;border-radius:8px 8px 0 0;overflow:hidden}.col div{transition:height .3s}
.col:hover{filter:brightness(1.12)}
.cap{position:absolute;left:0;right:0;border-top:1px dashed var(--red);font-size:11px;color:var(--red);text-align:right}
.xl{display:flex;gap:18px;padding:8px 8px 0}.xl div{flex:1;text-align:center;font-size:12px;color:var(--dim);max-width:120px}
select{background:var(--card);color:var(--txt);border:1px solid var(--edge);border-radius:var(--r-ctl);padding:8px 14px;font:inherit}
select:focus{outline:0;border-color:var(--txt);box-shadow:inset 0 0 0 .5px var(--txt)}
.foot{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style></head>
<body><div class="wrap">
<header class="hero">
 <div>
  <div class="eyebrow">B2Spin · Systems Design</div>
  <h1>Weekly<br>overview</h1>
  <p class="lead">Kir Artemov's hours for the Friday call with Noel. Sources: Claude working sessions, Slack, calendar. Manual Figma work is not visible, so every number is a lower bound. Board: <a href="https://b2spin.monday.com/boards/18429306474">AI Systems Design on monday</a></p>
 </div>
 <img src="img/systems.webp" alt="">
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer class="foot"><span>Kept by Systems Design</span><span>Every number is a lower bound</span></footer>
</div>
<script src="data.js"></script>
<script>
const C=window.CATEGORIES,T=window.TYPES,W=window.WEEKS;
/* B2S tones: chart series in kit colours and a grey ladder, whatever the old hex in data.js says */
const CT={tg:'#9DB0FF',plugins:'#F6CD7F',ds:'#F5A3B3',bh:'#9DDDB0',cs:'#E0E0E0',wow:'#8F8F8F',other:'#5C5C5C'};
Object.keys(C).forEach(k=>{if(CT[k])C[k].color=CT[k]});
const TT={Improvement:'#9DB0FF',Feature:'#9DDDB0',Bug:'#F5A3B3','New product':'#F6CD7F','New project':'#E0E0E0',Other:'#8F8F8F'};
Object.keys(T).forEach(k=>{if(TT[k])T[k]=TT[k]});
const HEX={'#5b8def':'#9DB0FF','#e8a33d':'#F6CD7F','#d9534f':'#F5A3B3','#3dbb7a':'#9DDDB0','#b07cf0':'#E0E0E0','#4fc3d9':'#E0E0E0','#8a8a95':'#8F8F8F','#55555f':'#5C5C5C'};
const tone=c=>HEX[String(c).toLowerCase()]||c;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=n=>Math.round(n*10)/10;
const md=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
const ART=n=>`<img src="img/${n}.webp" alt="">`;
function byKey(w,key){const m={};w.cards.forEach(c=>m[c[key]]=(m[c[key]]||0)+c.h);return m}
function bars(list,colorOf){const max=Math.max(...list.map(x=>x[1]),1);
  return list.map(([n,h,col])=>`<div class="row"><div>${esc(n)}</div><div><div class="bar" style="width:${h/max*100}%;background:${col||colorOf}"></div></div><div class="v">${r1(h)}</div></div>`).join('')}
function stack(parts){const t=parts.reduce((a,p)=>a+p[1],0)||1;
  return `<div class="stack">${parts.filter(p=>p[1]>0).map(([n,h,col])=>`<div title="${esc(n)}: ${r1(h)} h" style="width:${h/t*100}%;background:${tone(col)}">${h/t>.12?esc(n)+' '+Math.round(h)+' h':''}</div>`).join('')}</div>`}
function delta(now,prev){if(prev==null||now==null)return'';const d=r1(now-prev);if(!d)return'';return `<span class="d ${d>0?'up':'dn'}">${d>0?'+':''}${d}</span>`}
/* status cell: icon + word, colour from the kit by meaning */
function status(s){const t=String(s),l=t.toLowerCase();
  const m=l.startsWith('done')||l.startsWith('shipped')?['✓','var(--green)']:l.startsWith('waiting')||l.startsWith('blocked')?['!','var(--yellow)']:l.startsWith('working')||l.startsWith('qa')||l.startsWith('in progress')?['●','var(--blue)']:l.startsWith('not started')||l.startsWith('descoped')?['–','var(--faint)']:null;
  return m?`<span class="st"><b style="color:${m[1]}">${m[0]}</b><span>${esc(t)}</span></span>`:esc(t)}
const list=(xs)=>`<div class="panel"><ul>${xs.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`;

function week(i){
  const w=W[i],p=W[i-1],cat=byKey(w,'cat'),pc=p?byKey(p,'cat'):{};
  const catParts=Object.keys(C).filter(k=>cat[k]).map(k=>[C[k].name,cat[k],C[k].color]);
  const top=Object.entries(cat).sort((a,b)=>b[1]-a[1])[0];
  const typ=byKey(w,'type');
  let h=`<div class="meta">${esc(w.period)} · ${esc(w.sprint)} · call: ${esc(w.meeting)}</div>
  <div class="kpis">
   <div class="k"><b>${w.total} h${delta(w.total,p&&p.total)}</b><span>at least, in working sessions · contract 40 h</span></div>
   <div class="k"><b>${Math.round(top[1]/w.total*100)}%</b><span>on ${esc(C[top[0]].name)}</span></div>
   <div class="k"><b>${w.cards.filter(c=>c.h>0).length}</b><span>cards worked on</span></div>
   ${w.sprintPlan.spent?`<div class="k"><b>${w.sprintPlan.spent} h</b><span>on sprint cards · capacity ${w.sprintPlan.capacity} h</span></div>`:''}
   ${w.slack?`<div class="k"><b>${w.slack}</b><span>Slack messages sent</span></div>`:''}
  </div>
  ${w.tldr?`<h2>${ART('welcome')}In short</h2><div class="tldr"><ul>${w.tldr.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`:''}
  ${w.story?`<h2>By topic · click to open</h2><div class="sts">${w.story.map(t=>`<details class="st"><summary>${ART(t.img)}<div><b>${esc(t.title)}</b><small>${esc(t.state)}${t.blocker?' · blocker':''}</small></div><span class="hh">${t.h} h</span></summary><div class="bd">${t.blocker?`<div class="blk"><b>Blocker:</b> ${md(t.blocker)}</div>`:''}<ul>${t.points.map(x=>`<li>${md(x)}</li>`).join('')}</ul>${t.shot?`<a class="shot" href="img/${t.shot}.webp" target="_blank" rel="noopener"><img src="img/${t.shot}.webp" alt="${esc(t.title)} screenshot" loading="lazy"></a>`:''}</div></details>`).join('')}</div>`:''}
  <h2>Where the week went · ${w.total} h</h2>${stack(catParts)}
  <div class="leg">${catParts.map(([n,h,col])=>`<span><i style="background:${col}"></i>${esc(n)} ${r1(h)} h${delta(h,pc[Object.keys(C).find(k=>C[k].name===n)]||0)}</span>`).join('')}</div>
  <h2>Hours by card</h2>
  <div class="panel"><div class="leg" id="flt" style="margin-bottom:10px">${Object.keys(C).filter(k=>cat[k]).map(k=>`<button data-k="${k}" aria-pressed="true"><i style="background:${C[k].color}"></i>${esc(C[k].name)}</button>`).join('')}</div>
  <div id="cardbars"></div></div>
  <h2>By request type</h2><div class="panel">${bars(Object.entries(typ).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,v,T[n]||'#8F8F8F']))}</div>
  <h2>${esc(w.sprint)} · plan vs fact</h2>
  ${w.sprintPlan.split.length?stack(w.sprintPlan.split):''}
  <div class="tw"><table><tr><th>Card</th><th>${w.sprintPlan.col2||(w.sprintPlan.split.length?'Estimate':'Priority')}</th><th>Spent</th><th>Status</th></tr>
  ${w.sprintPlan.rows.map(r=>`<tr>${r.map((x,j)=>`<td>${j===3?status(x):esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>
  <h2>${ART('approved')}Done and shipped</h2>${list(w.done)}
  <h2>${ART('no-results')}Takeaways</h2>${list(w.takeaways)}
  ${w.topics.length?`<h2>${ART('no-briefs')}To discuss</h2>${list(w.topics)}`:''}
  ${(w.agreed||[]).length?`<h2>${ART('all-clear')}Agreed at the call</h2>${list(w.agreed)}`:''}`;
  $('#view').innerHTML=h;
  const off=new Set();
  const draw=()=>{const l=w.cards.filter(c=>!off.has(c.cat)).sort((a,b)=>b.h-a.h).map(c=>[c.name,c.h,C[c.cat].color]);$('#cardbars').innerHTML=bars(l)};
  document.querySelectorAll('#flt button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;off.has(k)?off.delete(k):off.add(k);b.classList.toggle('off');b.setAttribute('aria-pressed',!off.has(k));draw()});
  draw();
}

function compare(){
  const max=Math.max(...W.map(w=>w.total),60);
  const opts=W.map((w,i)=>`<option value="${i}">${esc(w.label)}</option>`).join('');
  $('#view').innerHTML=`<div class="meta">All weeks side by side. Click a column to open that week. Dashed line = 40 h week.</div>
  <h2>${ART('welcome')}Hours per week by area</h2>
  <div class="panel"><div class="cols" id="cols"><div class="cap" style="bottom:${40/max*100}%">40 h</div></div><div class="xl" id="xl"></div>
  <div class="leg" style="margin-top:14px">${Object.keys(C).map(k=>`<span><i style="background:${C[k].color}"></i>${esc(C[k].name)}</span>`).join('')}</div></div>
  <h2>Compare 2 weeks</h2>
  <div><select id="a" aria-label="First week">${opts}</select> <span style="color:var(--dim)">vs</span> <select id="b" aria-label="Second week">${opts}</select></div>
  <div id="cmp" style="margin-top:14px"></div>`;
  $('#cols').insertAdjacentHTML('beforeend',W.map((w,i)=>{const c=byKey(w,'cat');
    return `<div class="col" tabindex="0" data-i="${i}" title="${esc(w.label)}: ${w.total} h">${Object.keys(C).filter(k=>c[k]).map(k=>`<div title="${esc(C[k].name)}: ${r1(c[k])} h" style="height:${c[k]/max*240}px;background:${C[k].color}"></div>`).join('')}</div>`}).join(''));
  $('#xl').innerHTML=W.map(w=>`<div>${esc(w.label)}<br><b style="color:var(--txt)">${w.total} h</b></div>`).join('');
  document.querySelectorAll('.col').forEach(c=>{c.onclick=()=>go(+c.dataset.i);c.onkeydown=e=>{if(e.key==='Enter')go(+c.dataset.i)}});
  const A=$('#a'),B=$('#b');A.value=Math.max(0,W.length-2);B.value=W.length-1;
  const cmp=()=>{const a=W[A.value],b=W[B.value],ca=byKey(a,'cat'),cb=byKey(b,'cat');
    $('#cmp').innerHTML=`<div class="tw"><table><tr><th>Area</th><th>${esc(a.label)}</th><th>${esc(b.label)}</th><th>Change</th></tr>
    ${Object.keys(C).filter(k=>ca[k]||cb[k]).map(k=>`<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:${C[k].color}"></i>${esc(C[k].name)}</td><td>${r1(ca[k]||0)} h</td><td>${r1(cb[k]||0)} h</td><td>${delta(cb[k]||0,ca[k]||0)||'0'}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${a.total} h</b></td><td><b>${b.total} h</b></td><td>${delta(b.total,a.total)||'0'}</td></tr></table></div>`};
  A.onchange=B.onchange=cmp;cmp();
}

function go(i){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.i==String(i)));
  location.hash=i==='all'?'all':W[i].id; i==='all'?compare():week(i); window.scrollTo(0,0)}
$('#tabs').innerHTML=W.map((w,i)=>`<button class="tab" data-i="${i}">Week ${esc(w.label)}</button>`).reverse().join('')+`<button class="tab" data-i="all">All weeks</button>`;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.i==='all'?'all':+t.dataset.i));
const hi=W.findIndex(w=>w.id===location.hash.slice(1));
go(location.hash==='#all'?'all':(hi>=0?hi:W.length-1));
</script>
</body></html>
